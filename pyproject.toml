[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evals"
version = "0.1.0"
description = "Evaluation harness for exercising AI agent workflows"
readme = "README.md"
authors = [
    { name = "Your Team" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "openai>=2.29.0",
    "jsonpath-ng>=1.6",
    "opik>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.12"]

[project.scripts]
agent-evals = "agent_evals.__main__:main"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/agent_evals/__main__.py" = ["E402"]
